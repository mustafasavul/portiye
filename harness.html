<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portiye harness</title>
    <script>
      // Stubbed Tauri bridge. Mirrors the verification pattern in CLAUDE.md:
      // fixtures in, every command call recorded, and window.confirm sabotaged
      // so anything still depending on it silently does nothing (as it would in
      // the real WKWebView).
      window.confirm = () => undefined;
      window.prompt = () => undefined;
      window.__calls = [];

      const ports = [
        { pid: 100, port: 3000, name: "node", detail: "~/dev/shop", memory: 220 * 1048576, family: 100 },
        { pid: 101, port: 3001, name: "node", detail: "~/dev/shop worker", memory: 180 * 1048576, family: 100 },
        { pid: 200, port: 5173, name: "node", detail: "~/dev/portiye vite", memory: 90 * 1048576, family: 200 },
        { pid: 300, port: 5432, name: "postgres", detail: "/usr/local/var/postgres", memory: 60 * 1048576, family: 300 },
        { pid: 400, port: 8080, name: "java", detail: "gradle daemon", memory: 1600 * 1048576, family: 400 },
      ];

      const history = [
        { at: Date.now() - 5000, kind: "opened", port: 3000, pid: 100, name: "node", detail: "~/dev/shop", previous: null },
        { at: Date.now() - 60000, kind: "taken", port: 8080, pid: 400, name: "java", detail: "gradle daemon", previous: "node" },
        { at: Date.now() - 300000, kind: "closed", port: 4000, pid: 99, name: "python", detail: "~/dev/api", previous: null },
      ];

      const detail = {
        pid: 100, name: "node", command: "node server.js", cwd: "/Users/dev/shop",
        user: "dev", memory: 220 * 1048576, cpu: 12.5, uptime: 3725,
        ancestors: [{ pid: 1, name: "launchd" }, { pid: 50, name: "zsh" }],
        children: [{ pid: 101, name: "node" }],
        open_files: 42, files_sample: ["/Users/dev/shop/server.js", "/usr/lib/libc.dylib"],
        connections: ["TCP *:3000 (LISTEN)", "TCP 127.0.0.1:3000->127.0.0.1:51234 (ESTABLISHED)"],
        lsof_error: null,
      };

      const listeners = new Map();
      let nextCb = 1;

      const fixtures = {
        get_listening_ports: () => ports,
        get_port_history: () => history,
        clear_port_history: () => null,
        set_locale: () => null,
        set_watch_settings: () => null,
        process_detail: () => detail,
        start_logs: () => null,
        stop_logs: () => null,
        // 300 (postgres) refuses, which exercises the elevation retry prompt.
        kill_processes: (a) => ({
          killed: a.pids.filter((p) => p !== 300),
          children: a.pids.includes(100) ? [1001, 1002] : [],
          denied: a.pids.filter((p) => p === 300),
          missing: [],
          elevation: "portiye will ask for your password.",
        }),
        kill_processes_elevated: () => null,
        list_avds: () => [{ name: "Pixel_7_API_34", serial: "emulator-5554" }],
        list_simulators: () => [
          { udid: "UDID-1", name: "iPhone 17 Pro", state: "Booted", runtime: "iOS 26.3" },
          { udid: "UDID-2", name: "iPad Air", state: "Shutdown", runtime: "iOS 26.3" },
        ],
        list_runtimes: () => [
          { id: "docker:abc123", kind: "Docker", name: "redis", meta: "redis:7", running: true, can_start: true, can_stop: true, can_remove: true },
        ],
        launch_avd: () => null, stop_avd: () => null, wipe_avd: () => null, restart_avd: () => null,
        boot_simulator: () => null, shutdown_simulator: () => null, erase_simulator: () => null, restart_simulator: () => null,
        runtime_action: () => null,
        export_snapshot: () => "/Users/dev/Downloads/portiye-snapshot.json",
        export_logs: (a) => `/Users/dev/Downloads/portiye-${a.source.replace(/[:.\/]/g,"-")}.log`,
      };

      window.__TAURI_INTERNALS__ = {
        transformCallback(cb) {
          const id = nextCb++;
          window[`_${id}`] = cb;
          return id;
        },
        invoke(cmd, args) {
          window.__calls.push({ cmd, args });
          if (cmd === "plugin:event|listen") {
            const id = nextCb++;
            listeners.set(id, { event: args.event, fn: window[`_${args.handler}`] });
            return Promise.resolve(id);
          }
          if (cmd === "plugin:event|unlisten") return Promise.resolve(null);
          if (cmd.startsWith("plugin:")) return Promise.resolve(null);
          const f = fixtures[cmd];
          if (!f) return Promise.reject(`no fixture for ${cmd}`);
          return Promise.resolve(f(args || {}));
        },
      };

      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
        unregisterListener(_event, eventId) {
          listeners.delete(eventId);
        },
      };

      // Delivers to every live listener for that event, so a StrictMode double
      // mount behaves the way the real event plugin does.
      window.__emit = (event, payload) => {
        let n = 0;
        for (const [id, l] of listeners)
          if (l.event === event) {
            n++;
            l.fn({ event, id, payload });
          }
        return n;
      };
      window.__since = (n) => window.__calls.slice(n).map((c) => c.cmd + " " + JSON.stringify(c.args ?? {}));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
