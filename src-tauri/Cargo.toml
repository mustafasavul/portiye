[package]
name = "portiye"
version = "0.2.1"
description = "Find what's using a port and stop it: listening ports, the processes behind them, and local dev runtimes, from the menu bar"
authors = ["Mustafa Savul"]
license = "MIT"
repository = "https://github.com/mustafasavul/portiye"
homepage = "https://github.com/mustafasavul/portiye"
readme = "../README.md"
keywords = ["ports", "lsof", "process", "tauri", "devtools"]
categories = ["development-tools", "command-line-utilities", "gui"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portiye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri-plugin-autostart = "2.5.1"

