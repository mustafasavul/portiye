[package]
name = "portiye"
version = "0.1.0"
description = "Menu-bar app for listening ports, the processes behind them, and local dev runtimes"
authors = ["Mustafa Savul"]
license = "MIT"
repository = "https://github.com/mustafasavul/portiye"
homepage = "https://github.com/mustafasavul/portiye"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portiye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri-plugin-autostart = "2.5.1"

